<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Drag and Drop Uploader</title>
  <link rel="stylesheet" href="task50.css">
</head>
<body>

  <h1>Upload Files (Drag and Drop)</h1>

  <div class="upload-area" id="dropArea">
    <img src="upload.png" alt="Upload Icon" class="upload-img">
    <p>Drag files here or click to upload</p>
    <input type="file" id="fileInput" multiple>
  </div>

  <ul class="file-list" id="fileList"></ul>

  <script src="task50.js"></script>
</body>
</html>
