<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Theme Toggle App</title>
  <link rel="stylesheet" href="task48.css">
</head>
<body class="light-theme">
  <div class="container">
    <div class="top-bar">
      <h1>Theme Toggle</h1>
      <button id="toggleBtn">Switch to Dark Mode</button>
    </div>

    <div class="content-box">
      <p>This is a simple website that allows you to switch between light and dark mode using a toggle button.</p>
      <img src="theme.png" id="themeImage" alt="Theme Icon">
    </div>
  </div>

  <script src="task48.js"></script>
</body>
</html>
