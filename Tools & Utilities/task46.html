<!DOCTYPE html>
<html>
<head>
  <title>Password Strength Checker</title>
  <link rel="stylesheet" href="task46.css">
</head>
<body>

  <div class="container">
    <div class="toggle-container">
      <span class="mode-text">Dark Mode</span>
      <label class="switch">
        <input type="checkbox" onclick="toggleDarkMode()">
        <span class="slider"></span>
      </label>
    </div>

    <h2>Password Strength Checker</h2>

    <input type="password" id="passwordInput" placeholder="Enter your password" oninput="checkStrength()">

    <div id="strengthBox">
      <span id="strengthText">Strength: </span>
      <div id="strengthBar"></div>
    </div>

    <img src="lock icon.png" id="lockIcon" alt="Lock Icon">
  </div>

  <script src="task46.js"></script>
</body>
</html>
